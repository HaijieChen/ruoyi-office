spring:
  main:
    banner-mode: off
    lazy-initialization: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/oa_u9_iso?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2

mybatis-plus:
  type-aliases-package: cn.iocoder.yudao.module.bpm.dal.dataobject
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

yudao:
  info:
    base-package: cn.iocoder.yudao.module.bpm.dal.mysql.oa
  tenant:
    enable: true
