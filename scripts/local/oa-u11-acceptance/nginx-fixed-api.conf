# Fixed-target reverse proxy only. No CONNECT, no arbitrary upstream.
server {
    listen 48081;
    server_name _;
    location / {
        proxy_pass http://oa-u11-iso-api:48081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
